name: Build & Release APK

# 触发方式：
# 1. 推送 tag（如 v1.0.0）→ 自动构建并发布到 GitHub Release
# 2. 推送到 main/master → 构建 APK 作为构建产物上传（不发布）
# 3. 手动从 Actions 页面触发（可选择构建类型）
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: '是否创建 GitHub Release（仅 release 且无 tag 时可选）'
        required: false
        default: false
        type: boolean

env:
  # 注意：此版本必须提供 Dart SDK 版本 ≥ pubspec.yaml 中 sdk 约束（当前 ^3.12.2）
  # 对应关系：Flutter 3.47.0 → Dart 3.22.x（报错日志建议用此版本）
  # 如遇版本再漂移，可到 https://docs.flutter.dev/release/archive 查版本矩阵
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'                   # build.gradle 使用 Java 17

permissions:
  contents: write                       # 发布 Release 资产需写权限
  pull-requests: read

jobs:
  # ======================================================================
  # Job 1：构建 Android APK（含签名）
  # ======================================================================
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_path_release: ${{ steps.paths.outputs.apk_release }}
      apk_path_debug: ${{ steps.paths.outputs.apk_debug }}
      apk_name_release: ${{ steps.paths.outputs.name_release }}
      apk_name_debug: ${{ steps.paths.outputs.name_debug }}
      build_type: ${{ steps.meta.outputs.build_type }}

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      # ---------- 版本 / 构建元信息 ----------
      - name: 解析版本与构建类型
        id: meta
        run: |
          set -e
          # 从 pubspec.yaml 读取 version: x.y.z+n
          PUBSPEC_VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          VER_NAME=$(echo "$PUBSPEC_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$PUBSPEC_VER" | cut -d'+' -f2)
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "Pubspec 版本名=$VER_NAME 版本号=$VER_CODE"

          # 确定构建类型：tag / workflow_dispatch → release，PR → debug，push 分支 => release
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BT="debug"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BT="${{ github.event.inputs.build_type }}"
          else
            BT="release"
          fi
          echo "build_type=$BT" >> "$GITHUB_OUTPUT"
          echo "build_type=$BT"

      # ---------- 环境：JDK ----------
      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ---------- 环境：Flutter ----------
      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: 验证 Flutter 环境
        run: |
          flutter --version
          flutter doctor -v || true

      # ---------- 依赖 ----------
      - name: 获取 Flutter 依赖
        run: flutter pub get

      - name: 生成应用图标（可选，图标已在仓库中可跳过）
        run: |
          # 仅当资源变化时重新生成；失败也不阻塞
          dart run flutter_launcher_icons || true

      # ---------- 签名密钥还原（仅 release）----------
      # 原理：
      #   1) GitHub Secrets 里存 base64 编码的 keystore（ANDROID_KEYSTORE_B64）
      #   2) Secrets 里存 keyAlias / keyPassword / storePassword
      #   3) 写入 android/key.properties + 临时 .jks 文件
      # 若密钥未配置，release 构建将退化为 debug 签名
      - name: 准备签名配置（release）
        if: steps.meta.outputs.build_type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # ============== 公共清理函数 ==============
          cleanup_then_fallback() {
            echo "⚠️  $1"
            echo "⚠️  回退方案：release 构建将使用 debug 签名（可安装但不建议上架）"
            rm -f "$GITHUB_WORKSPACE/android/key.properties"
            rm -f "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
            # 写入空值覆盖（避免之前成功一次后残留）
            echo "ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS="      >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD="   >> "$GITHUB_ENV"
            echo "ANDROID_STORE_PASSWORD=" >> "$GITHUB_ENV"
          }

          if [[ -z "$KEYSTORE_B64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            cleanup_then_fallback "未检测到完整的签名密钥 Secret（4 个任意一个为空即视为未配置）"
            exit 0
          fi

          echo "✅ 检测到签名密钥 Secret，写入签名配置..."

          # 0) 常见错误：把 PEM 证书 / 私钥（带 -----BEGIN-----）当成 jks base64 贴进来
          #    这种情况 base64 也能解码，但解出来是证书 DER，不是合法 jks，后面签名一定挂
          #    这里立刻识别并给精准提示，避免用户在下一步才莫名其妙挂
          if printf '%s' "$KEYSTORE_B64" | grep -q "-----BEGIN"; then
            FIRST_LINE="$(printf '%s' "$KEYSTORE_B64" | head -n 1)"
            cleanup_then_fallback "PEM 证书误贴为 jks: 检测到 -----BEGIN----- 开头，你的 ANDROID_KEYSTORE_B64 是证书/私钥文本而非 jks 二进制 base64。请对 upload-keystore.jks 文件本身做 base64 编码后重新覆盖 Secret。第一行=$FIRST_LINE"
            exit 0
          fi

          # 1) 清洗 base64：
          #    - 去掉所有空白（换行/回车/空格/Tab）—— 这是 base64: invalid input 的 99% 根因
          #    - 去掉 BOM / 常见非 base64 控制字符
          #    - 然后用 base64 -di（忽略非字母字符）进一步容错
          CLEAN_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t\0\v\f' | sed 's/^\xEF\xBB\xBF//')"
          echo "[debug] 清洗前长度=${#KEYSTORE_B64}，清洗后长度=${#CLEAN_B64}"

          # 额外自检：合法 base64 的长度必须是 4 的倍数
          REMAINDER=$(( ${#CLEAN_B64} % 4 ))
          if [[ "$REMAINDER" != "0" ]]; then
            echo "[debug] 清洗后长度 ${#CLEAN_B64} 不是 4 的倍数（base64 规范要求），说明原始内容被截断或粘贴不完整"
          fi

          JKS_PATH="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          if ! printf '%s' "$CLEAN_B64" | base64 -di > "$JKS_PATH"; then
            cleanup_then_fallback "base64 解码失败，你的 ANDROID_KEYSTORE_B64 Secret 内容不是合法的 base64。请按本节最后一段的『重新生成 base64 单行命令』重新生成并覆盖 Secret。"
            exit 0
          fi

          # 2) jks 文件大小 / 完整性校验（避免解码出来的是 0 字节垃圾文件 / DER 证书）
          if [[ ! -s "$JKS_PATH" ]]; then
            cleanup_then_fallback "解码后的 jks 文件大小为 0 字节，base64 内容无效。"
            exit 0
          fi
          if [[ $(stat -c%s "$JKS_PATH") -lt 500 ]]; then
            cleanup_then_fallback "解码后的文件 < 500 字节，不是正常的 jks（通常 2KB+）。你很可能把 base64 的证书内容当作 jks 文件做了编码。请直接对 upload-keystore.jks 这个文件本身做 base64。"
            exit 0
          fi
          echo "[debug] 解码后的 jks 大小：$(stat -c%s "$JKS_PATH") 字节"
          ls -l "$JKS_PATH"
          # Magic bytes 校验：JKS 头 4 字节是 FE ED FE ED（十六进制）
          MAGIC="$(xxd -l 4 -p "$JKS_PATH" 2>/dev/null || true)"
          echo "[debug] jks 头 4 字节 = $MAGIC（正常 JKS 应为 feedfeed；PKCS12 会是其他值，但 keytool 仍能打开）"

          # 3) 用 keytool -list 校验 jks 能被正确打开（含 alias / storePass 是否正确）
          #    失败就立刻降级，避免把错误带到 30 分钟后的 gradle 签名步骤才挂
          if ! keytool -list -keystore "$JKS_PATH" -storepass "$STORE_PASSWORD" 2>&1 | tee /tmp/ktlist.txt >/dev/null; then
            echo "[debug] keytool 输出："; cat /tmp/ktlist.txt
            cleanup_then_fallback "keystore 打不开（storePassword 错误 / 文件损坏 / alias 不存在）。请核对 4 个 Secret 是否与你本地生成 upload-keystore.jks 时填写的一致。"
            exit 0
          fi
          # 额外校验 alias 是否在 keytool 输出里存在
          if ! grep -q "${KEY_ALIAS}," /tmp/ktlist.txt; then
            echo "[debug] keytool 输出中未找到 alias=${KEY_ALIAS}，实际可用 aliases："
            grep -E '^[[:space:]]*[A-Za-z0-9_-]+,' /tmp/ktlist.txt || true
            cleanup_then_fallback "ANDROID_KEY_ALIAS=<$KEY_ALIAS> 在 keystore 中不存在。请把 Secret 改为 keytool 时你真实填写的 alias（一般是 upload）。"
            exit 0
          fi
          echo "✅ keytool 校验通过：keystore 能正确打开，且 alias=<$KEY_ALIAS> 存在"

          # 4) 注入 CI 环境变量（build.gradle.kts 会优先读取这 4 个）
          #    ANDROID_KEYSTORE_PATH 给绝对路径，避免 rootProject.file() 相对路径歧义
          echo "ANDROID_KEYSTORE_PATH=$JKS_PATH"               >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"                  >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"            >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$STORE_PASSWORD"        >> "$GITHUB_ENV"

          # 5) 再写一份 key.properties 作为本地/兜底
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=app/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          EOF
          echo "✅ 已通过 CI 环境变量注入正式签名，并写入 key.properties 兜底（后续 gradle 将用 release 正式签名打包）"

      # ---------- 构建 APK ----------
      - name: 构建 APK (${{ steps.meta.outputs.build_type }})
        id: build
        run: |
          BT="${{ steps.meta.outputs.build_type }}"
          if [[ "$BT" == "release" ]]; then
            flutter build apk --release --split-per-abi
          else
            flutter build apk --debug
          fi

      # ---------- 整理输出路径 ----------
      - name: 确定 APK 输出路径与文件名
        id: paths
        run: |
          set -e
          VER="${{ steps.meta.outputs.version_name }}"
          VT="${{ steps.meta.outputs.build_type }}"
          BUILD_DIR="build/app/outputs/flutter-apk"

          REL_APK=""
          DEBUG_APK=""
          REL_NAME=""
          DEBUG_NAME=""

          # release 产物（split-per-abi 会生成多个）
          if [[ -f "$BUILD_DIR/app-arm64-v8a-release.apk" ]]; then
            REL_APK="$BUILD_DIR/app-arm64-v8a-release.apk"
            REL_NAME="社交教练_v${VER}_arm64_release.apk"
            echo "release 模式 (split-per-abi)，选择 arm64 作为主产物: $REL_APK"
          elif [[ -f "$BUILD_DIR/app-release.apk" ]]; then
            REL_APK="$BUILD_DIR/app-release.apk"
            REL_NAME="社交教练_v${VER}_universal_release.apk"
            echo "release 模式 (universal): $REL_APK"
          fi

          if [[ -f "$BUILD_DIR/app-debug.apk" ]]; then
            DEBUG_APK="$BUILD_DIR/app-debug.apk"
            DEBUG_NAME="社交教练_v${VER}_debug.apk"
          fi

          {
            echo "apk_release=$REL_APK"
            echo "apk_debug=$DEBUG_APK"
            echo "name_release=$REL_NAME"
            echo "name_debug=$DEBUG_NAME"
          } >> "$GITHUB_OUTPUT"

          ls -lah "$BUILD_DIR" || true

      # ---------- 上传构建产物（无论是否发布都保留）----------
      - name: 上传 Release APK 构建产物
        if: steps.paths.outputs.apk_release != ''
        uses: actions/upload-artifact@v4
        with:
          name: APK-Release
          path: ${{ steps.paths.outputs.apk_release }}
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Debug APK 构建产物
        if: steps.paths.outputs.apk_debug != ''
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug
          path: ${{ steps.paths.outputs.apk_debug }}
          if-no-files-found: warn
          retention-days: 15

      # ---------- 额外：同时上传 mapping + symbols ----------
      - name: 上传 ProGuard mapping（release）
        if: steps.meta.outputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ProGuard-Mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

  # ======================================================================
  # Job 2：当推送 tag（v*） 或手动选择创建 Release 时，发布 GitHub Release
  # ======================================================================
  create-release:
    name: 创建 GitHub Release & 上传 APK
    needs: build-apk
    if: |
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.create_release == true
          && needs.build-apk.outputs.build_type == 'release')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 源码（为了读取 CHANGELOG / README）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Release APK 产物
        uses: actions/download-artifact@v4
        with:
          name: APK-Release
          path: ./release-artifact

      - name: 整理 APK 文件并重命名
        id: prep
        run: |
          set -e
          ls -lah ./release-artifact
          SRC=$(find ./release-artifact -name "*.apk" | head -1)
          [[ -z "$SRC" ]] && { echo "❌ 未找到 APK 产物"; exit 1; }
          VER="${{ needs.build-apk.outputs.version_name }}"
          NAME="社交教练_v${VER}_arm64_release.apk"
          if [[ -n "${{ needs.build-apk.outputs.apk_name_release }}" ]]; then
            NAME="${{ needs.build-apk.outputs.apk_name_release }}"
          fi
          mv "$SRC" "./$NAME"
          ls -lah "./$NAME"
          echo "apk_path=./$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

          # 计算文件哈希
          if command -v sha256sum >/dev/null 2>&1; then
            SHA=$(sha256sum "./$NAME" | awk '{print $1}')
            echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
            echo "SHA256: $SHA"
          fi

      - name: 生成发布说明（Release Notes）
        id: notes
        run: |
          VER="${{ needs.build-apk.outputs.version_name }}"
          TAG="${GITHUB_REF_NAME:-v$VER}"
          {
            echo "## 🎉 社交教练 v$VER 发布"
            echo ""
            echo "- **版本号**：\`$VER\` (${{ needs.build-apk.outputs.version_code }})"
            echo "- **构建类型**：${{ needs.build-apk.outputs.build_type }}"
            echo "- **生成时间**：$(date -u '+%Y-%m-%d %H:%M UTC')"
            if [[ -n "${{ steps.prep.outputs.sha256 }}" ]]; then
              echo "- **SHA256**：\`${{ steps.prep.outputs.sha256 }}\`"
            fi
            echo ""
            echo "---"
            echo ""
            echo "### 📱 安装说明"
            echo "1. 下载下方 APK 到手机"
            echo "2. 允许「未知来源」安装（首次安装需在系统设置中开启）"
            echo "3. 安装完成后打开即可使用"
            echo ""
            echo "### 🚀 功能特性"
            echo "- 10 关社交教学关卡（初级 → 中级 → 高级 → 毕业考核）"
            echo "- 知识词典：系统化社交技巧整理，支持搜索/分类筛选"
            echo "- **知识练习**：基于单个知识点的情景对话训练，即时评分与参考话术"
            echo "- **知识测试**：单选 / 多选 / 判断题，详细解析帮助巩固记忆"
            echo "- **要点提炼**：核心要点卡片 + 记忆模式（隐藏答案自测）"
            echo "- 快速练习：20+ 高频场景，碎片化练习社交技巧"
            echo "- 一键导出知识手册 PDF"
            echo ""
            echo "---"
            echo "### 📝 最近变更（自动从提交提取）"
            echo ""
          } > RELEASE_NOTES.md

          # 附加最近的提交日志
          if command -v git >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$PREV_TAG" ]]; then
              echo "#### 对比 $PREV_TAG → $TAG" >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null | head -50 >> RELEASE_NOTES.md || true
            else
              git log --oneline -20 --pretty=format:"- %s (%h)" --no-merges 2>/dev/null >> RELEASE_NOTES.md || true
            fi
          fi

          echo "" >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: 创建 GitHub Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 社交教练 v${{ needs.build-apk.outputs.version_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.prep.outputs.apk_path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
